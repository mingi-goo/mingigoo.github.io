<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <title>칭다오 가족여행</title>
  <meta name="theme-color" content="#F2F4F6">
  <meta name="color-scheme" content="light only">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="칭다오 여행">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="preview" class="preview" hidden></div>

  <main id="main">
    <section id="tab-now" class="tab" aria-label="지금"></section>
    <section id="tab-schedule" class="tab" aria-label="일정" hidden></section>
    <section id="tab-places" class="tab" aria-label="장소" hidden></section>
    <section id="tab-more" class="tab" aria-label="더보기" hidden></section>
  </main>

  <button id="lost-btn" class="lost-btn" type="button">길 잃었을 때</button>

  <nav class="tabbar" aria-label="메뉴">
    <button type="button" data-tab="now" aria-current="page"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle class="fill" cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg></span>지금</button>
    <button type="button" data-tab="schedule"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect class="fill" x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>일정</button>
    <button type="button" data-tab="places"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="fill" d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg></span>장소</button>
    <button type="button" data-tab="more"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect class="fill" x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect class="fill" x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect class="fill" x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect class="fill" x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg></span>더보기</button>
  </nav>

  <!-- 길 잃었을 때 -->
  <div id="lost" class="overlay lost" role="dialog" aria-modal="true" aria-label="길 잃었을 때" hidden></div>

  <!-- 중국어 크게 보기 -->
  <div id="big" class="overlay big" role="dialog" aria-modal="true" aria-label="중국어 크게 보기" hidden>
    <p class="big-hint">현지인에게 이 화면을 보여 주세요</p>
    <div class="big-stage"><p id="big-text" class="big-text" lang="zh-CN"></p></div>
    <p id="big-sub" class="big-sub"></p>
    <button type="button" class="btn big-close" data-close>닫기</button>
  </div>

  <noscript><p class="noscript">이 앱은 자바스크립트가 필요합니다.</p></noscript>
</body>
</html>
