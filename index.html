<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <title>칭다오 가족여행</title>
  <meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="칭다오 여행">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="preview" class="preview" hidden></div>

  <main id="main">
    <section id="tab-now" class="tab" aria-label="지금"></section>
    <section id="tab-schedule" class="tab" aria-label="일정" hidden></section>
    <section id="tab-places" class="tab" aria-label="장소" hidden></section>
    <section id="tab-more" class="tab" aria-label="더보기" hidden></section>
  </main>

  <button id="lost-btn" class="lost-btn" type="button">길 잃었을 때</button>

  <nav class="tabbar" aria-label="메뉴">
    <button type="button" data-tab="now" aria-current="page"><span class="ico" aria-hidden="true">🕒</span>지금</button>
    <button type="button" data-tab="schedule"><span class="ico" aria-hidden="true">🗓️</span>일정</button>
    <button type="button" data-tab="places"><span class="ico" aria-hidden="true">📍</span>장소</button>
    <button type="button" data-tab="more"><span class="ico" aria-hidden="true">☰</span>더보기</button>
  </nav>

  <!-- 길 잃었을 때 -->
  <div id="lost" class="overlay lost" role="dialog" aria-modal="true" aria-label="길 잃었을 때" hidden></div>

  <!-- 중국어 크게 보기 -->
  <div id="big" class="overlay big" role="dialog" aria-modal="true" aria-label="중국어 크게 보기" hidden>
    <p class="big-hint">현지인에게 이 화면을 보여 주세요</p>
    <div class="big-stage"><p id="big-text" class="big-text" lang="zh-CN"></p></div>
    <p id="big-sub" class="big-sub"></p>
    <button type="button" class="btn big-close" data-close>닫기</button>
  </div>

  <noscript><p class="noscript">이 앱은 자바스크립트가 필요합니다.</p></noscript>
</body>
</html>
